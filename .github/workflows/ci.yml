name: CI
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        python: ['3.11', '3.13']
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      EGG_FILE: 'egg-7-days-to-die-arm64.json'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (offline; no game downloads or license acceptance)
        run: python -W error -m unittest discover -s tests -v
      - name: Compile with strict warnings
        run: python -W error -m compileall -q -f .
      - name: Rebuild published export after tests
        run: python build_egg.py --update-url "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/${EGG_FILE}"
      - name: Rebuild twice, validate Egg and shell sources
        run: python -W error scripts/publication_guard.py --verify-build
      - name: Committed export must match build
        run: git diff --exit-code -- "$EGG_FILE"
