name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
  publish:
    needs: ci
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      PYTHONUTF8: '1'
      EGG_FILE: 'egg-7-days-to-die-arm64.json'
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Validate stable release tag and reproducible export
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { printf '%s\n' 'Use a stable vMAJOR.MINOR.PATCH tag'; exit 1; }
          python -W error scripts/publication_guard.py --verify-build
          git diff --exit-code -- "$EGG_FILE"
          mkdir -p dist
          cp -- "$EGG_FILE" dist/
          (cd dist && sha256sum -- "$EGG_FILE" > SHA256SUMS)
      - name: Publish verified assets (no overwrite)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" "dist/$EGG_FILE" dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
            --title "$RELEASE_TAG" --notes 'Standalone Pelican Egg; verify SHA256SUMS before importing. See PUBLISHING.md for license and smoke-test requirements.'
      - name: Verify published assets and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --dir verified --pattern "$EGG_FILE" --pattern SHA256SUMS
          (cd verified && sha256sum --check SHA256SUMS)
          cmp -- "dist/$EGG_FILE" "verified/$EGG_FILE"
